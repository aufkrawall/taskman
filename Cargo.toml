[workspace]
resolver = "2"
members = ["crates/tm-core", "crates/tm-platform", "crates/tm-app", "crates/tm-service"]
# `vendor/egui` is our egui fork (see llm-wiki/render-pipeline.md). It carries its own
# [workspace] and uses `workspace = true` field inheritance plus relative path deps, so it
# must stay a separate workspace; it is reached only through [patch.crates-io] below.
exclude = ["vendor/egui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
tm-core = { path = "crates/tm-core" }
tm-platform = { path = "crates/tm-platform" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "local-time"] }
tracing-appender = "0.2"
sysinfo = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_SystemInformation",
  "Win32_System_Com",
] }
windows-service = "0.8.0"

[profile.release]
# Compile-time-first choice: thin LTO + parallel codegen units keep release
# builds fast and multicore; fat LTO bought single-digit milliseconds of
# startup at several minutes of serialized linking. The app's startup floor
# is the renderer/framework init, not our codegen quality.
lto = "thin"
strip = "symbols"
opt-level = 3
panic = "abort"

[profile.release.package."*"]
opt-level = 3

[profile.dev]
# Line-tables-only keeps panic backtraces meaningful while avoiding the
# multi-GB DWARF that full debuginfo produces when 16 parallel rustc
# processes each hold a copy in RAM (the "RAM explosion" during builds).
debug = "line-tables-only"

[profile.test]
# Tests inherit from dev; keep the same memory-conscious debuginfo.
debug = "line-tables-only"

[profile.dev.package."*"]
# Optimize heavy third-party deps even in dev so wgpu/sysinfo stay usable while debugging.
opt-level = 2

# --- Vendored egui fork -------------------------------------------------------
#
# Sub-pixel (ClearType) text and the native CPU renderer both live in a fork of
# emilk/egui, vendored at `vendor/egui` via `git subtree --squash` from tag 0.36.1.
#
# EVERY egui-repo crate that appears in Cargo.lock must be patched. Patching only
# some of them puts two incompatible copies of egui in the graph, and the errors
# that produces ("expected `egui::Context`, found `egui::Context`") are miserable
# to diagnose. Verify with `cargo tree -d` after any change here.
#
# Note that `cargo clippy/test --workspace` does NOT reach an excluded workspace:
# the fork has its own quality gate, `tools/check-fork.ps1`, run by build.py --check.
[patch.crates-io]
emath = { path = "vendor/egui/crates/emath" }
ecolor = { path = "vendor/egui/crates/ecolor" }
epaint = { path = "vendor/egui/crates/epaint" }
epaint_default_fonts = { path = "vendor/egui/crates/epaint_default_fonts" }
egui = { path = "vendor/egui/crates/egui" }
egui-winit = { path = "vendor/egui/crates/egui-winit" }
egui_glow = { path = "vendor/egui/crates/egui_glow" }
egui-wgpu = { path = "vendor/egui/crates/egui-wgpu" }
eframe = { path = "vendor/egui/crates/eframe" }
