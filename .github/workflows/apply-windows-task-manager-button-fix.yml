name: Apply Windows Task Manager button fix

on:
  push:
    branches: [fix/windows-task-manager-button]
    paths:
      - .github/workflows/apply-windows-task-manager-button-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-task-manager-button
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply delegation fix
        run: python .github/scripts/apply_windows_task_manager_button_fix.py
      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/apply-windows-task-manager-button-fix.yml
          rm .github/scripts/apply_windows_task_manager_button_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/tm-platform/src/win/core_service.rs .github/workflows/apply-windows-task-manager-button-fix.yml .github/scripts/apply_windows_task_manager_button_fix.py
          git commit -m 'Fix Windows Task Manager button delegation'
          git push origin HEAD:fix/windows-task-manager-button
