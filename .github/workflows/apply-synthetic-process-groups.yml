name: Apply synthetic process group rows

on:
  push:
    branches:
      - improve/synthetic-process-group-rows
    paths:
      - .github/workflows/apply-synthetic-process-groups.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/synthetic-process-group-rows
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply source and documentation changes
        run: python .github/scripts/apply_synthetic_process_groups.py
      - name: Format
        run: cargo fmt --all
      - name: Targeted tests
        run: cargo test -p tm-app
      - name: Host release build
        run: python build.py --host-only
      - name: Remove bootstrap files
        shell: bash
        run: |
          rm .github/scripts/apply_synthetic_process_groups.py
          rm .github/workflows/apply-synthetic-process-groups.yml
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Use synthetic aggregate rows for process groups"
          git push origin HEAD:improve/synthetic-process-group-rows
