name: Apply DBG_CONTINUE import fix
on:
  push:
    branches: [fix/dbg-continue-import]
    paths: [.github/workflows/apply-dbg-continue-fix.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dbg-continue-import
      - name: Patch import
        shell: python
        run: |
          from pathlib import Path
          p = Path('crates/tm-platform/src/win/taskmgr_replacement.rs')
          s = p.read_text()
          old = '''    use windows::Win32::Foundation::CloseHandle;\n    use windows::Win32::System::Diagnostics::Debug::{\n        ContinueDebugEvent, DBG_CONTINUE, DEBUG_EVENT, DebugActiveProcessStop,\n'''
          new = '''    use windows::Win32::Foundation::{CloseHandle, DBG_CONTINUE};\n    use windows::Win32::System::Diagnostics::Debug::{\n        ContinueDebugEvent, DEBUG_EVENT, DebugActiveProcessStop,\n'''
          if s.count(old) != 1:
              raise SystemExit(f'expected one import block, found {s.count(old)}')
          p.write_text(s.replace(old, new))
      - name: Commit fix
        run: |
          rm .github/workflows/apply-dbg-continue-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/tm-platform/src/win/taskmgr_replacement.rs .github/workflows/apply-dbg-continue-fix.yml
          git commit -m 'Fix DBG_CONTINUE import'
          git push origin HEAD:fix/dbg-continue-import
