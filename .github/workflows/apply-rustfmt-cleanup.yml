name: Apply rustfmt cleanup

on:
  push:
    branches:
      - fix/post-merge-format
    paths:
      - .github/workflows/apply-rustfmt-cleanup.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-merge-format
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install fork formatter toolchain
        shell: pwsh
        run: rustup toolchain install 1.95.0 --component rustfmt --profile minimal --no-self-update
      - name: Format workspace and fork
        shell: pwsh
        run: |
          cargo fmt --all
          cargo +1.95.0 fmt --all --manifest-path vendor/egui/Cargo.toml
      - name: Commit formatter cleanup and remove bootstrap workflow
        shell: pwsh
        run: |
          Remove-Item .github/workflows/apply-rustfmt-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: apply rustfmt cleanup"
          git push origin HEAD:fix/post-merge-format
