name: Apply Windows process classification fix

on:
  push:
    branches:
      - fix/windows-process-classification

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-process-classification
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Normalize wiki patch anchor
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path("llm-wiki/repo-map.md")
          text = path.read_text(encoding="utf-8")
          old = "from a system/launch boundary. Repeat runs of one image under one parent group\n  separately (`sibling_run_key`), including `svchost.exe` under `services.exe`. A group's aggregate is"
          new = "from a system/launch boundary. Repeat runs of one image under one\n  parent group separately (`sibling_run_key`), including `svchost.exe` under `services.exe`.\n  A group's aggregate is"
          if text.count(old) != 1:
              raise SystemExit(f"wiki anchor normalization: expected one match, found {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          '@ | python -

      - name: Apply classification patch
        run: python .github/scripts/apply_windows_process_classification.py

      - name: Apply window restore patch
        run: python .github/scripts/apply_window_restore_fix.py

      - name: Format
        run: cargo fmt --all

      - name: Full quality gate
        run: python build.py --check

      - name: Host release build
        run: python build.py --host-only

      - name: Commit validated implementation
        shell: pwsh
        run: |
          Remove-Item .github/scripts/apply_windows_process_classification.py
          Remove-Item .github/scripts/apply_window_restore_fix.py
          Remove-Item .github/workflows/apply-windows-process-classification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: classify Windows processes and preserve restore placement"
          git push origin HEAD:fix/windows-process-classification
