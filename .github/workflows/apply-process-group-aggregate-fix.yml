name: Apply process group aggregate fix

on:
  push:
    branches: [fix/process-group-aggregate-order]
    paths:
      - .github/workflows/apply-process-group-aggregate-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/process-group-aggregate-order
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply aggregate fix
        run: python .github/scripts/apply_process_group_aggregate_fix.py
      - name: Format
        run: cargo fmt --all
      - name: Commit fix
        shell: bash
        run: |
          rm .github/workflows/apply-process-group-aggregate-fix.yml
          rm .github/scripts/apply_process_group_aggregate_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/tm-app/src/tabs/processes.rs .github/workflows/apply-process-group-aggregate-fix.yml .github/scripts/apply_process_group_aggregate_fix.py
          git commit -m 'Fix process group aggregate rollups'
          git push origin HEAD:fix/process-group-aggregate-order
