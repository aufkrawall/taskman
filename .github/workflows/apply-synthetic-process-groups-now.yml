name: Apply synthetic process groups now

on:
  push:
    branches:
      - improve/synthetic-process-group-rows
    paths:
      - .github/workflows/apply-synthetic-process-groups-now.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/synthetic-process-group-rows
      - name: Apply source and documentation changes
        run: python3 .github/scripts/apply_synthetic_process_groups.py
      - name: Remove bootstrap files
        run: |
          rm -f .github/scripts/apply_synthetic_process_groups.py
          rm -f .github/workflows/apply-synthetic-process-groups.yml
          rm -f .github/workflows/apply-synthetic-process-groups-now.yml
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Use synthetic aggregate rows for process groups"
          git push origin HEAD:improve/synthetic-process-group-rows
