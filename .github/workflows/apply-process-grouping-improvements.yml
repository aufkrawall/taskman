name: Apply process grouping improvements

on:
  push:
    branches:
      - improve/process-grouping
    paths:
      - .github/workflows/apply-process-grouping-improvements.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: improve/process-grouping
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize patch-script indentation
        run: python .github/scripts/fix_process_grouping_patch.py
      - name: Apply focused source patch
        run: python .github/scripts/apply_process_grouping.py
      - name: Format
        run: cargo fmt --all
      - name: Targeted tests
        run: cargo test -p tm-app
      - name: Release build
        run: python build.py --host-only
      - name: Commit implementation and remove bootstrap files
        shell: pwsh
        run: |
          Remove-Item .github/workflows/apply-process-grouping-improvements.yml
          Remove-Item .github/scripts/apply_process_grouping.py
          Remove-Item .github/scripts/fix_process_grouping_patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- crates/tm-app/src/tabs/processes.rs llm-wiki/repo-map.md llm-wiki/current.md llm-wiki/log/recent.md .github/workflows/apply-process-grouping-improvements.yml .github/scripts/apply_process_grouping.py .github/scripts/fix_process_grouping_patch.py
          git commit -m "Improve process grouping heuristics"
          git push origin HEAD:improve/process-grouping
