[package]
name = "tm-app"
description = "Cross-platform task manager GUI (Wayland/X11/Win32/Metal)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "taskman"
path = "src/main.rs"

[features]
default = ["software", "wgpu", "glow"]
# The native CPU renderer. Tried first: it needs no driver, and it is the only backend
# that can do sub-pixel (ClearType) text. The GPU backends stay as fallbacks for now.
software = ["eframe/software"]
wgpu = ["eframe/wgpu_no_default_features", "dep:wgpu"]
glow = ["eframe/glow"]

[dependencies]
tm-core = { workspace = true }
tm-platform = { workspace = true }
eframe = { version = "=0.36.1", default-features = false, features = [
  "accesskit",
  "default_fonts",
  "wayland",
  "x11",
] }
tracing = { workspace = true }
serde_json = { workspace = true }
rfd = "0.15"

[package.metadata.notes]
renderer = "wgpu primary, glow fallback; wayland+x11 enabled for native Linux"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Console",
  # Popup-menu theming reaches two uxtheme exports by ordinal; instance
  # coordination itself lives in tm-platform.
  "Win32_System_LibraryLoader",
] }
# Only to read the HWND out of `eframe::Frame` so the native caption can be
# painted in the app's colors. Pinned to the version eframe itself uses --
# a second copy of the crate would make its `HasWindowHandle` impl unusable.
raw-window-handle = "0.6.2"
tray-icon = { version = "0.24.2", default-features = false }
wgpu = { version = "30", default-features = false, features = ["dx12"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["vulkan"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["metal"], optional = true }

[dev-dependencies]
# Headless CPU rendering of the real widgets (src/render_snapshot.rs). `egui_software`
# is our CPU painter in the vendored egui fork; it is not published, so it is reached by
# path rather than through [patch.crates-io].
egui_software = { path = "../../vendor/egui/crates/egui_software" }
png = "0.18"
