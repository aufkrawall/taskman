[package]
name = "tm-app"
description = "Cross-platform task manager GUI (Wayland/X11/Win32/Metal)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "taskman"
path = "src/main.rs"

[features]
default = ["wgpu", "glow"]
wgpu = ["eframe/wgpu"]
glow = ["eframe/glow"]

[dependencies]
tm-core = { workspace = true }
tm-platform = { workspace = true }
eframe = { version = "=0.36.1", default-features = false, features = [
  "accesskit",
  "default_fonts",
  "wayland",
  "x11",
] }
egui_extras = { version = "=0.36.1", features = ["serde"] }
tracing = { workspace = true }
serde_json = { workspace = true }
parking_lot = { workspace = true }

[package.metadata.notes]
renderer = "wgpu primary, glow fallback; wayland+x11 enabled for native Linux"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Console"] }
