[package]
name = "tm-app"
description = "Cross-platform task manager GUI (Wayland/X11/Win32/Metal)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "taskman"
path = "src/main.rs"

[features]
default = ["software", "wgpu", "glow"]
# Native CPU rasterization is the default for desktop builds.
# It draws directly and supports sub-pixel (ClearType) text.
software = ["eframe/software"]
wgpu = ["eframe/wgpu_no_default_features", "dep:wgpu"]
glow = ["eframe/glow"]

[dependencies]
tm-core = { workspace = true }
tm-platform = { workspace = true }
# Theme palette + font setup, shared with the setup installer so both render
# the exact same Windows 11 look. tm-app re-exports it as `crate::theme` /
# `crate::fonts`.
tm-ui = { workspace = true }
eframe = { version = "=0.36.1", default-features = false, features = [
  "accesskit",
  "default_fonts",
  "wayland",
  "x11",
] }
tracing = { workspace = true }
serde_json = { workspace = true }
rfd = "0.15"
# Vendored egui fork, reached by path like egui_software below: used for the
# pointer-tracking hint that keeps at-pointer hover visuals repainting while
# the fork's egui-winit coalesces cursor-move repaints (fork divergence #10).
# Default features stay off; eframe already enables the winit features it needs.
egui-winit = { path = "../../vendor/egui/crates/egui-winit", default-features = false }

[package.metadata.notes]
renderer = "CPU default; D3D12 on Windows, Vulkan on Linux, Metal on macOS"

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Console",
  # GetCurrentThreadId lives here: the tray thread publishes its id so the
  # UI thread can post visibility changes to it. Popup-menu theming reaches
  # two uxtheme exports by ordinal; instance coordination itself lives in
  # tm-platform.
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
# Only to read the HWND out of `eframe::Frame` so the native caption can be
# painted in the app's colors. Pinned to the version eframe itself uses --
# a second copy of the crate would make its `HasWindowHandle` impl unusable.
raw-window-handle = "0.6.2"
tray-icon = { version = "0.24.2", default-features = false }
wgpu = { version = "30", default-features = false, features = ["dx12"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6.2"
wgpu = { version = "30", default-features = false, features = ["vulkan"], optional = true }
# StatusNotifierItem tray icon: pure-Rust D-Bus, so no GTK/libappindicator
# system library is needed for the cross-built Linux binary. zbus is already
# in the tree through rfd's XDG portal backend.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "30", default-features = false, features = ["metal"], optional = true }

[dev-dependencies]
# Headless CPU rendering of the real widgets (src/render_snapshot.rs). `egui_software`
# is our CPU painter in the vendored egui fork; it is not published, so it is reached by
# path rather than through [patch.crates-io].
egui_software = { path = "../../vendor/egui/crates/egui_software" }
png = "0.18"

[target.'cfg(windows)'.dev-dependencies]
# `src/dwrite_reference.rs`: native DirectWrite text as the ground truth for the
# text-weight tests. tm-platform already compiles these features into `windows`.
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Gdi",
] }

[lints.rust]
# Rust 1.97 promotes otherwise harmless Zig/lld stderr (notably the deprecated
# `-O1` optimization spelling) to a compiler warning during Linux zigbuilds.
# `unknown_lints` keeps this compatible with the workspace's older MSRV.
unknown_lints = "allow"
linker_messages = "allow"
